# Unsigned builds until Apple/Windows certificates are added as repository secrets.
name: desktop
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm install
        working-directory: desktop
      - run: npx tauri icon src-tauri/icons/icon.png
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: 'VELOMNA desktop v__VERSION__'
          releaseBody: 'Windows and macOS shells around velomna.zeroorigine.com. Unsigned alpha.'
          releaseDraft: true
          args: ${{ matrix.args }}
